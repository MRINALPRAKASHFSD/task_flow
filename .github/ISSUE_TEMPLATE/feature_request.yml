---
name: Feature Request
description: Suggest a new feature or improvement for TaskFlow.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees:
  - MRINALPRAKASHFSD
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature!
        Please provide as much context as possible so we can evaluate it effectively.

  - type: checkboxes
    id: existing_issues
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and the roadmap before opening this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? Who is affected and how?
      placeholder: "I often need to assign a due date to tasks but there is no field for this."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see implemented.
      placeholder: "Add an optional 'Due date' date picker field to the task form. Display a badge on the task card when the due date has passed."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative approaches or workarounds?

  - type: dropdown
    id: priority
    attributes:
      label: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to similar implementations, or any other relevant information.
