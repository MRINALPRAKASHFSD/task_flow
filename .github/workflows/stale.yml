# GitHub Actions — Stale Issue / PR Management
# Automatically marks and closes stale issues and pull requests.
#
# Copyright (c) 2026 Mrinal Prakash
# SPDX-License-Identifier: MIT
#
# Action version pin:
#   actions/stale v9 → SHA pinned below
#
# To update: https://github.com/actions/stale/releases

name: Stale

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

# Least-privilege permissions.
permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        # actions/stale v9.0.0 — 2023-11-07
        uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e
        with:
          # ─── Issues ───────────────────────────────────────────────────────────
          # Mark as stale after 60 days of inactivity
          days-before-issue-stale: 60
          # Close stale issue after a further 14 days without activity
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity for 60 days. It will be closed in 14 days unless there is
            further activity. If this issue is still relevant, please leave a comment.
          close-issue-message: >
            This issue was closed automatically because it has been stale for 14 days
            with no further activity. Feel free to reopen it if the problem persists.

          # ─── Pull Requests ────────────────────────────────────────────────────
          # Mark PRs stale after 30 days of inactivity
          days-before-pr-stale: 30
          # Close stale PR after a further 7 days
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not
            had any activity for 30 days. It will be closed in 7 days unless there is
            further activity. Please rebase, update or comment if you intend to continue.
          close-pr-message: >
            This pull request was closed automatically because it has been stale for
            7 days with no further activity. Feel free to reopen it when you are ready.

          # ─── Exemptions ───────────────────────────────────────────────────────
          exempt-issue-labels: "pinned,security,breaking-change"
          exempt-pr-labels: "pinned,security"

          # Do not process more than 100 items per run to respect rate limits
          operations-per-run: 100
