# GitHub Actions — CodeQL Security Analysis
# Performs static analysis of JavaScript for security vulnerabilities.
#
# Copyright (c) 2026 Mrinal Prakash
# SPDX-License-Identifier: MIT
#
# Action version pins:
#   actions/checkout              v4 → SHA pinned below
#   github/codeql-action/init     v3 → SHA pinned below
#   github/codeql-action/autobuild v3 → SHA pinned below
#   github/codeql-action/analyze  v3 → SHA pinned below
#
# To update pins, visit:
#   https://github.com/github/codeql-action/releases

name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Sunday at 02:17 UTC
    - cron: "17 2 * * 0"

# Least-privilege permissions.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2 — 2024-10-28
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialize CodeQL
        # github/codeql-action/init v3.39.2 — 2026-11-03
        uses: github/codeql-action/init@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126
        with:
          languages: javascript-typescript
          # Use the default CodeQL query suite for JavaScript.
          queries: security-and-quality

      - name: Autobuild
        # github/codeql-action/autobuild v3.39.2 — 2026-11-03
        uses: github/codeql-action/autobuild@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze v3.39.2 — 2026-11-03
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:javascript-typescript"
